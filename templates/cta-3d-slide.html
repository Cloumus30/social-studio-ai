<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1350, initial-scale=1.0">
  <title>Slide CTA 3D (Minimalist & Transparent) - Logikanya.Tech</title>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;

      font-family: 'Poppins', sans-serif;

<body class="bg-white text-[#18181b] flex flex-col justify-between p-16 relative">
  <!-- Blueprint Square Line Grid Pattern (40x40px, opacity 0.6) -->
  <div class="absolute inset-0 bg-[linear-gradient(to_right,#e2e8f0_1px,transparent_1px),linear-gradient(to_bottom,#e2e8f0_1px,transparent_1px)] bg-[size:40px_40px] opacity-60 pointer-events-none"></div>

  <!-- HEADER -->
  <header class="relative z-10 flex items-center justify-between border-b border-slate-200/90 pb-6 bg-white/80 backdrop-blur-sm -mx-16 px-16 -mt-16 pt-16">
    <div class="flex items-center gap-3.5">
      <div class="w-11 h-11 p-1 rounded-xl bg-white border border-slate-200 shadow-sm flex items-center justify-center shrink-0">
        <img src="../assets/logo.png" alt="Logikanya.Tech Logo" class="w-full h-full object-contain">
      </div>
      <span class="font-extrabold text-2xl tracking-tight text-[#18181b]">Logikanya<span class="text-[#c2410c]">.Tech</span></span>
    </div>
    <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-orange-50 border border-orange-200 text-xs font-bold tracking-wider uppercase text-[#c2410c]">
      <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
      <span>CATATAN TEKNIK</span>
    </div>
  </header>

  <!-- BODY CONTENT -->
  <main class="relative z-10 my-auto flex flex-col justify-between h-[1020px] py-2">
    <!-- Top Text Section (Standar Baku Ramah & Santai Tanpa Overclaim) -->
    <div class="space-y-3 pt-2">
      <h1 class="text-5xl font-black leading-[1.18] tracking-tight text-[#18181b]">
        Suka Bahasan Teknis Praktis Kayak Gini? <br/>
        <span class="text-[#c2410c]">Yuk Konek di @logikanyatech</span>
      </h1>
      <p class="text-xl text-slate-600 font-normal leading-relaxed">
        Berbagi catatan arsitektur sistem dan teknologi tanpa jargon yang bikin pusing.
      </p>
    </div>

    <!-- PURE TRANSPARENT SEAMLESS 3D SHOWCASE -->
    <div class="relative w-full h-[520px] flex items-center justify-center my-auto">
      <canvas id="three-canvas" class="w-full h-full block"></canvas>
    </div>

    <!-- 1 BAR CTA HORIZONTAL ELEGAN -->
    <div class="flex items-center gap-4 w-full pb-2">
      <!-- Tombol Follow Utama (Oranye Lapang) -->
      <div class="flex-1 p-5 rounded-2xl bg-[#c2410c] text-white flex items-center justify-center gap-3 font-extrabold text-xl shadow-md shadow-orange-500/15">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
        <span>Follow @logikanyatech</span>
      </div>

      <!-- Aksi Ringan 1: Save -->
      <div class="px-6 py-5 rounded-2xl bg-[#f8fafc] border border-slate-200 text-slate-700 font-bold text-base flex items-center gap-2.5 shadow-xs">
        <i data-lucide="bookmark" class="w-5 h-5 text-[#c2410c]"></i>
        <span>Simpan</span>
      </div>

      <!-- Aksi Ringan 2: Share -->
      <div class="px-6 py-5 rounded-2xl bg-[#f8fafc] border border-slate-200 text-slate-700 font-bold text-base flex items-center gap-2.5 shadow-xs">
        <i data-lucide="share-2" class="w-5 h-5 text-slate-600"></i>
        <span>Bagikan</span>
      </div>
    </div>
  </main>

  <!-- FOOTER -->

      <i data-lucide="check-check" class="w-4 h-4 text-[#c2410c]"></i>
      <span>@logikanyatech</span>
    </div>
  </footer>

  <script>
    (function init3D() {
      const canvas = document.getElementById('three-canvas');
      const width = canvas.parentElement.clientWidth;
      const height = canvas.parentElement.clientHeight;

      // 1. Scene & Camera
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 1000);
      camera.position.set(0, 0, 15);

      // 2. WebGL Renderer (Transparent Alpha)
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 2, 2));
      renderer.setClearColor(0x000000, 0); // Pure transparent
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;

      // 3. Studio Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      // Key Light (Warm White)
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
      keyLight.position.set(7, 10, 10);
      scene.add(keyLight);

      // Fill Light (Soft Cyan Tint)
      const fillLight = new THREE.DirectionalLight(0x0891b2, 1.2);
      fillLight.position.set(-8, -4, 6);
      scene.add(fillLight);

      // Back Rim Light (Terracotta Orange)
      const rimLight = new THREE.DirectionalLight(0xc2410c, 3.0);
      rimLight.position.set(2, -8, -5);
      scene.add(rimLight);

      // Subtle Center Point Glow for Orange Element
      const centerPoint = new THREE.PointLight(0xc2410c, 1.8, 12);
      centerPoint.position.set(0, 0, 3.5);
      scene.add(centerPoint);

      // 4. Soft Ambient Floor Shadow under the Floating Monolith
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 512;
      shadowCanvas.height = 256;
      const sctx = shadowCanvas.getContext('2d');
      const grad = sctx.createRadialGradient(256, 128, 10, 256, 128, 220);
      grad.addColorStop(0, 'rgba(15, 23, 42, 0.28)');
      grad.addColorStop(0.5, 'rgba(15, 23, 42, 0.12)');
      grad.addColorStop(1, 'rgba(15, 23, 42, 0)');
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, 512, 256);

      const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
      const shadowMaterial = new THREE.MeshBasicMaterial({
        map: shadowTexture,
        transparent: true,
        opacity: 0.85,
        depthWrite: false
      });
      const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(12.5, 6.0), shadowMaterial);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.set(0, -3.2, 0);
      scene.add(shadowPlane);

      // 5. Main 3D Floating Studio Monolith Group
      const mainGroup = new THREE.Group();
      scene.add(mainGroup);

      // A. Monolith Base Plate (Dark Anodized Titanium)
      function createRoundedRectShape(w, h, r) {
        const shape = new THREE.Shape();
        const x = -w / 2;
        const y = -h / 2;
        shape.moveTo(x + r, y);
        shape.lineTo(x + w - r, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + r);
        shape.lineTo(x + w, y + h - r);
        shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        shape.lineTo(x + r, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
        return shape;
      }

      const plateShape = createRoundedRectShape(10.2, 5.0, 0.45);
      const plateGeom = new THREE.ExtrudeGeometry(plateShape, {
        depth: 0.65,
        bevelEnabled: true,
        bevelSegments: 4,
        steps: 1,
        bevelSize: 0.12,
        bevelThickness: 0.12
      });
      plateGeom.center();

      const plateMat = new THREE.MeshStandardMaterial({
        color: 0x18181b,
        roughness: 0.24,
        metalness: 0.85
      });
      const monolithPlate = new THREE.Mesh(plateGeom, plateMat);
      mainGroup.add(monolithPlate);

      // B. High-Resolution Texture Canvas for Branding & Typography
      const textCanvas = document.createElement('canvas');
      textCanvas.width = 2048;
      textCanvas.height = 1024;
      const ctx = textCanvas.getContext('2d');

      // Surface
      ctx.fillStyle = '#18181b';
      ctx.fillRect(0, 0, 2048, 1024);

      // Blueprint Grid Lines on Texture
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 2;
      const step = 48;
      for (let x = 0; x < 2048; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, 1024);
        ctx.stroke();
      }
      for (let y = 0; y < 1024; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(2048, y);
        ctx.stroke();
      }

      const drawMonolithSurface = () => {
        ctx.drawImage(logoImg, 320, 292, 382, 440);
        ctx.font = '900 134px "Poppins", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('Logikanya', 760, 540);
        ctx.fillStyle = '#c2410c';
        ctx.fillText('.Tech', 1440, 540);
      };
      logoImg.onload = () => {
        drawMonolithSurface();
        if (typeof texture !== 'undefined') texture.needsUpdate = true;
      };
      if (logoImg.complete) {
        drawMonolithSurface();
      }

      const texture = new THREE.CanvasTexture(textCanvas);
      texture.anisotropy = 8;
      const textMat = new THREE.MeshStandardMaterial({
        map: texture,
        transparent: false,
        roughness: 0.3,
        metalness: 0.4
      });
      const textPlaneGeom = new THREE.PlaneGeometry(9.6, 4.4);
      const textPlane = new THREE.Mesh(textPlaneGeom, textMat);
      textPlane.position.z = 0.46;
      mainGroup.add(textPlane);

      // C. Extruded 3D Curly Braces "{ }" in Front
      function createBraceShape(isLeft = true) {
        const s = new THREE.Shape();
        const flip = isLeft ? 1 : -1;
        s.moveTo(0.4 * flip, 1.4);
        s.lineTo(0.15 * flip, 1.4);
        s.quadraticCurveTo(0, 1.4, 0, 1.15);
        s.lineTo(0, 0.3);
        s.quadraticCurveTo(0, 0.05, -0.25 * flip, 0);
        s.quadraticCurveTo(0, -0.05, 0, -0.3);
        s.lineTo(0, -1.15);
        s.quadraticCurveTo(0, -1.4, 0.15 * flip, -1.4);
        s.lineTo(0.4 * flip, -1.4);
        s.lineTo(0.4 * flip, -1.2);
        s.lineTo(0.22 * flip, -1.2);
        s.quadraticCurveTo(0.12 * flip, -1.2, 0.12 * flip, -1.05);
        s.lineTo(0.12 * flip, -0.25);
        s.quadraticCurveTo(0.12 * flip, 0, -0.08 * flip, 0);
        s.quadraticCurveTo(0.12 * flip, 0, 0.12 * flip, 0.25);
        s.lineTo(0.12 * flip, 1.05);
        s.quadraticCurveTo(0.12 * flip, 1.2, 0.22 * flip, 1.2);
        s.lineTo(0.4 * flip, 1.2);
        s.closePath();
        return s;
      }

      const braceSettings = {
        depth: 0.35,
        bevelEnabled: true,
        bevelSegments: 3,
        steps: 1,
        bevelSize: 0.05,
        bevelThickness: 0.05

        metalness: 0.65,
        emissive: 0xc2410c,

      });

      // Left 3D Brace
      const leftBraceGeom = new THREE.ExtrudeGeometry(createBraceShape(true), braceSettings);
      leftBraceGeom.center();
      const leftBrace = new THREE.Mesh(leftBraceGeom, orangeMaterial);
      leftBrace.scale.set(1.1, 1.1, 1.1);

      // Right 3D Brace
      const rightBraceGeom = new THREE.ExtrudeGeometry(createBraceShape(false), braceSettings);
      rightBraceGeom.center();
      const rightBrace = new THREE.Mesh(rightBraceGeom, orangeMaterial);
      rightBrace.scale.set(1.1, 1.1, 1.1);
      rightBrace.position.set(3.7, 0.1, 0.68);
      mainGroup.add(rightBrace);

      // D. Floating 3D Data Cubes & Tech Artifacts around Monolith
      const cubes = [];
      const cubeMatCyan = new THREE.MeshStandardMaterial({
        color: 0x0891b2,
        roughness: 0.2,
        metalness: 0.7,
        emissive: 0x0891b2,
        emissiveIntensity: 0.35
      });
      const cubeMatOrange = new THREE.MeshStandardMaterial({
        color: 0xc2410c,
        roughness: 0.2,
        metalness: 0.8,
        emissive: 0xc2410c,
        emissiveIntensity: 0.45
      });

      // Cube 1 (Orange, Top Left)
      const c1 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), cubeMatOrange);
      c1.position.set(-5.6, 2.0, 1.2);
      c1.rotation.set(0.4, 0.6, 0.2);
      scene.add(c1);
      cubes.push({ mesh: c1, rotSpeed: 0.015 });

      // Cube 2 (Cyan, Bottom Right)
      const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), cubeMatCyan);
      c2.position.set(5.7, -1.8, 1.4);
      c2.rotation.set(-0.3, 0.5, 0.4);
      scene.add(c2);
      cubes.push({ mesh: c2, rotSpeed: -0.012 });

      // 6. Initial Isometric View
      mainGroup.rotation.x = 0.16;
      mainGroup.rotation.y = -0.24;
      mainGroup.rotation.z = 0.04;
      mainGroup.position.y = 0.2;

      // Render First Frame Immediately for Headless Playwright
      renderer.render(scene, camera);
      window.__THREE_READY__ = true;
      window.__THREE_READY = true;

      // 7. Interactive Floating Animation
      let clock = 0;
      function animate() {
        requestAnimationFrame(animate);
        clock += 0.018;

        mainGroup.position.y = 0.2 + Math.sin(clock) * 0.16;
        mainGroup.rotation.y = -0.24 + Math.sin(clock * 0.7) * 0.05;
        mainGroup.rotation.x = 0.16 + Math.cos(clock * 0.5) * 0.03;

        cubes.forEach((item, idx) => {
          item.mesh.rotation.x += item.rotSpeed;
          item.mesh.rotation.y += item.rotSpeed * 1.2;
          item.mesh.position.y += Math.sin(clock + idx) * 0.003;
        });

        renderer.render(scene, camera);
      }
      animate();
    })();

    lucide.createIcons();
  </script>
</body>
</html>
