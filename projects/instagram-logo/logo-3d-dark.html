<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1080, initial-scale=1.0">
  <title>Logo Instagram 3D Dark - Logikanya.Tech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@800;900&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background-color: #09090b;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    .blueprint-grid {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(226, 232, 240, 0.7) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(226, 232, 240, 0.7) 1px, transparent 1px);
    }
    .blueprint-grid-dark {
      background-size: 40px 40px;
      background-image: 
        linear-gradient(to right, rgba(39, 39, 42, 0.45) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(39, 39, 42, 0.45) 1px, transparent 1px);
    }
  </style>
</head>
<body class="blueprint-grid-dark flex items-center justify-center">

  <!-- AMBIENT RADIAL GLOW -->
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(194,65,12,0.16)_0%,rgba(9,9,11,0.96)_65%)] pointer-events-none"></div>

  <!-- PURE 3D THREE.JS CANVAS -->
  <canvas id="three-canvas" class="w-full h-full block relative z-10"></canvas>

  <script>
    (async function init3DLogo() {
      // Ensure Poppins font is fully ready before drawing on canvas
      if (document.fonts) {
        try {
          await document.fonts.load('900 178px Poppins');
          await document.fonts.ready;
        } catch (_) {}
      }

      const canvas = document.getElementById('three-canvas');
      const width = 1080;
      const height = 1080;

      // 1. Scene & Camera
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(34, width / height, 0.1, 1000);
      camera.position.set(0, 0, 14.8);

      // 2. WebGL Renderer
      const renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        antialias: true,
        alpha: true,
        powerPreference: "high-performance"
      });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 2, 2));
      renderer.setClearColor(0x000000, 0);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      // 3. Precision Studio Lighting Rig (Sharp edge bevel highlights)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      // Top Key Light
      const keyLight = new THREE.DirectionalLight(0xffffff, 2.8);
      keyLight.position.set(6, 10, 8);
      scene.add(keyLight);

      // Fill Light
      const fillLight = new THREE.DirectionalLight(0x0891b2, 1.4);
      fillLight.position.set(-8, -2, 5);
      scene.add(fillLight);

      // Edge Rim Light (Vibrant bevel edge reflections)
      const rimLight = new THREE.DirectionalLight(0xea580c, 3.6);
      rimLight.position.set(3, -7, -3);
      scene.add(rimLight);

      // 4. Floor Soft Contact Shadow
      const shadowCanvas = document.createElement('canvas');
      shadowCanvas.width = 512;
      shadowCanvas.height = 512;
      const sctx = shadowCanvas.getContext('2d');
      const grad = sctx.createRadialGradient(256, 256, 30, 256, 256, 230);
      grad.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
      grad.addColorStop(0.5, 'rgba(0, 0, 0, 0.35)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      sctx.fillStyle = grad;
      sctx.fillRect(0, 0, 512, 512);

      const shadowTexture = new THREE.CanvasTexture(shadowCanvas);
      const shadowMaterial = new THREE.MeshBasicMaterial({
        map: shadowTexture,
        transparent: true,
        opacity: 0.9,
        depthWrite: false
      });
      const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(10.2, 10.2), shadowMaterial);
      shadowPlane.rotation.x = -Math.PI / 2;
      shadowPlane.position.set(0, -3.9, 0);
      scene.add(shadowPlane);

      // 5. Main 3D Emblem Group
      const mainGroup = new THREE.Group();
      scene.add(mainGroup);

      // Balanced Hero 3D Perspective Tilt
      mainGroup.rotation.x = 0.08;
      mainGroup.rotation.y = -0.11;
      mainGroup.rotation.z = 0.012;

      // Squircle shape creator
      function createRoundedRectShape(w, h, r) {
        const shape = new THREE.Shape();
        const x = -w / 2;
        const y = -h / 2;
        shape.moveTo(x + r, y);
        shape.lineTo(x + w - r, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + r);
        shape.lineTo(x + w, y + h - r);
        shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        shape.lineTo(x + r, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);
        return shape;
      }

      const plateW = 6.3;
      const plateH = 7.3;
      const plateR = 0.85;

      // A. Physical Monolith Plate
      const plateShape = createRoundedRectShape(plateW, plateH, plateR);
      const plateGeom = new THREE.ExtrudeGeometry(plateShape, {
        depth: 0.52,
        bevelEnabled: true,
        bevelSegments: 6,
        steps: 1,
        bevelSize: 0.15,
        bevelThickness: 0.15
      });
      plateGeom.center();

      const plateMat = new THREE.MeshPhysicalMaterial({
        color: 0x18181b,
        roughness: 0.2,
        metalness: 0.85,
        clearcoat: 0.85,
        clearcoatRoughness: 0.08
      });
      const monolithPlate = new THREE.Mesh(plateGeom, plateMat);
      mainGroup.add(monolithPlate);

      // B. High-Resolution Decal Surface on PlaneGeometry
      const textCanvas = document.createElement('canvas');
      textCanvas.width = 2048;
      textCanvas.height = 2374;
      const ctx = textCanvas.getContext('2d');

      function drawRoundedRectPath(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
      }

      function drawDecal(logo) {
        ctx.clearRect(0, 0, textCanvas.width, textCanvas.height);

        // Fill only inside the rounded plate contour
        const inset = 30;
        const cornerR = 250;
        drawRoundedRectPath(ctx, inset, inset, textCanvas.width - inset * 2, textCanvas.height - inset * 2, cornerR);
        ctx.fillStyle = '#18181b';
        ctx.fill();

        // Technical blueprint grid on plate
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 3;
        for (let x = 0; x < textCanvas.width; x += 64) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, textCanvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < textCanvas.height; y += 64) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(textCanvas.width, y);
          ctx.stroke();
        }

        // Inner chamfer border line
        ctx.strokeStyle = 'rgba(234, 88, 12, 0.45)';
        ctx.lineWidth = 6;
        drawRoundedRectPath(ctx, inset + 40, inset + 40, textCanvas.width - (inset + 40) * 2, textCanvas.height - (inset + 40) * 2, cornerR - 35);
        ctx.stroke();

        // Draw Official Brand Logo
        if (logo) {
          const logoW = 1060;
          const logoH = 1220;
          const logoX = (textCanvas.width - logoW) / 2;
          const logoY = 270;
          ctx.drawImage(logo, logoX, logoY, logoW, logoH);
        }

        // Brand Typography: Logikanya.Tech (Crisp Geometric Poppins 900)
        ctx.font = '900 178px "Poppins", sans-serif';
        ctx.textBaseline = 'middle';

        const textY = 1880;
        const brand = "Logikanya";
        const dotTech = ".Tech";

        const brandW = ctx.measureText(brand).width;
        ctx.fillStyle = '#ea580c';
        const dotTechW = ctx.measureText(dotTech).width;

        const totalW = brandW + dotTechW;
        const startX = (textCanvas.width - totalW) / 2;

        ctx.textAlign = 'left';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(brand, startX, textY);
        ctx.fillStyle = '#ea580c';
        ctx.fillText(dotTech, startX + brandW, textY);

        ctx.restore();
      }

      const decalTexture = new THREE.CanvasTexture(textCanvas);
      decalTexture.anisotropy = 16;

      // Use MeshBasicMaterial for the graphic decal so brand colors stay 100% rich, saturated and true
      const decalMat = new THREE.MeshBasicMaterial({
        map: decalTexture,
        transparent: true,
        polygonOffset: true,
        polygonOffsetFactor: -2,
        polygonOffsetUnits: -2
      });

      const decalPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(plateW, plateH),
        decalMat
      );
      decalPlane.position.z = 0.42;
      mainGroup.add(decalPlane);

      // C. Synchronous Image Decode & Handshake
